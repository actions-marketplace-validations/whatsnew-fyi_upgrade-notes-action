# Dogfood: this repository's own dependency PRs get the notes, from the
# checked-out source rather than a release.
name: Upgrade notes

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
